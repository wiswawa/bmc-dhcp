name: Feature request / 功能建议
description: Describe the workflow a new capability would improve.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem / 实际问题
      description: Explain your current BMC setup and the step that is difficult.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior / 期望行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 已尝试的替代方案
