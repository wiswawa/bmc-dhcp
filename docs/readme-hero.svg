<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">BMC DHCP：服务器 BMC 临时 DHCP 与发现工具</title>
  <desc id="desc">在 macOS 和 Windows 上将网卡接入服务器 BMC 管理口，完成临时 DHCP、设备识别并打开管理页面。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.58" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#e8f2ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1c30"/>
      <stop offset="1" stop-color="#102b45"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#17345b" flood-opacity="0.2"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#2563eb" fill-opacity="0.11"/>
    </pattern>
  </defs>

  <rect width="1600" height="720" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="720" rx="34" fill="url(#dots)"/>
  <circle cx="1450" cy="110" r="250" fill="#60a5fa" fill-opacity="0.13"/>
  <circle cx="880" cy="720" r="250" fill="#34d399" fill-opacity="0.09"/>
  <path d="M0 610C280 500 520 750 820 610S1270 460 1600 580" fill="none" stroke="url(#accent)" stroke-opacity="0.17" stroke-width="2"/>

  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif">
    <g transform="translate(92 72)">
      <rect width="246" height="42" rx="21" fill="#ffffff" stroke="#bfdbfe"/>
      <circle cx="22" cy="21" r="5" fill="#059669"/>
      <text x="38" y="27" fill="#1e3a5f" font-size="16" font-weight="700">开源 · GPL-2.0-only · 自包含</text>
    </g>

    <text x="92" y="223" fill="#0b1f36" font-size="92" font-weight="800" letter-spacing="-3">BMC DHCP</text>
    <text x="94" y="289" fill="#163a63" font-size="34" font-weight="750">服务器 BMC 临时 DHCP 与发现</text>
    <text x="94" y="337" fill="#4c6683" font-size="23">连接管理口，选择网卡，分配临时地址并直接打开管理页面。</text>

    <g transform="translate(94 390)">
      <rect width="166" height="44" rx="12" fill="#ffffff" stroke="#c7dcf4"/>
      <text x="22" y="29" fill="#24496e" font-size="17" font-weight="700">macOS 15+</text>
    </g>
    <g transform="translate(274 390)">
      <rect width="204" height="44" rx="12" fill="#ffffff" stroke="#c7dcf4"/>
      <text x="22" y="29" fill="#24496e" font-size="17" font-weight="700">Windows 10/11 x64</text>
    </g>
    <g transform="translate(492 390)">
      <rect width="228" height="44" rx="12" fill="#ffffff" stroke="#c7dcf4"/>
      <text x="22" y="29" fill="#24496e" font-size="17" font-weight="700">内置 Python / Scapy</text>
    </g>

    <g transform="translate(94 492)">
      <text x="0" y="0" fill="#0b1f36" font-size="18" font-weight="800">DHCP 握手</text>
      <text x="0" y="44" fill="#1d4f7f" font-size="25" font-weight="700">发现 → 提供 → 请求 → 确认</text>
      <text x="0" y="76" fill="#6b7f94" font-size="16">自动分配地址、识别 BMC，并保持短租约可控</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="878" y="86" width="624" height="548" rx="32" fill="url(#panel)"/>
      <rect x="910" y="118" width="560" height="50" rx="15" fill="#061426" fill-opacity="0.5"/>
      <circle cx="940" cy="143" r="7" fill="#f87171"/>
      <circle cx="964" cy="143" r="7" fill="#fbbf24"/>
      <circle cx="988" cy="143" r="7" fill="#34d399"/>
      <text x="1027" y="150" fill="#a9bdd2" font-size="16" font-weight="600">BMC DHCP · 隔离管理网络</text>
      <rect x="1360" y="127" width="86" height="32" rx="16" fill="#0b382f" stroke="#34d399" stroke-opacity="0.45"/>
      <circle cx="1378" cy="143" r="5" fill="#34d399"/>
      <text x="1392" y="149" fill="#86efac" font-size="13" font-weight="700">已启动</text>

      <rect x="934" y="210" width="206" height="126" rx="22" fill="#0f2742" stroke="#38bdf8" stroke-opacity="0.35"/>
      <text x="958" y="240" fill="#7dd3fc" font-size="14" font-weight="800">所选网口</text>
      <text x="958" y="279" fill="#f8fafc" font-size="25" font-weight="750">Mac / PC</text>
      <text x="958" y="309" fill="#a9bdd2" font-size="16">10.99.0.1 / 24</text>

      <path d="M1140 272H1264" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
      <path d="M1250 261L1264 272L1250 283" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="1149" y="233" width="106" height="26" rx="13" fill="#0b382f" stroke="#34d399" stroke-opacity="0.4"/>
      <text x="1163" y="251" fill="#86efac" font-size="12" font-weight="800">DHCP 已启用</text>

      <rect x="1270" y="198" width="176" height="150" rx="22" fill="#102d49" stroke="#22d3ee" stroke-opacity="0.3"/>
      <text x="1294" y="230" fill="#67e8f9" font-size="14" font-weight="800">服务器 BMC</text>
      <text x="1294" y="267" fill="#f8fafc" font-size="20" font-weight="750">iDRAC</text>
      <text x="1294" y="294" fill="#f8fafc" font-size="20" font-weight="750">iLO / XCC</text>
      <text x="1294" y="321" fill="#f8fafc" font-size="20" font-weight="750">iBMC</text>

      <rect x="934" y="368" width="512" height="148" rx="22" fill="#071426" stroke="#94a3b8" stroke-opacity="0.15"/>
      <text x="958" y="400" fill="#8fa7bd" font-size="14" font-weight="800">当前租约</text>
      <circle cx="965" cy="438" r="7" fill="#34d399"/>
      <text x="983" y="445" fill="#f8fafc" font-size="22" font-weight="750">10.99.0.100</text>
      <text x="1224" y="444" fill="#a9bdd2" font-size="16">租期 300 秒</text>
      <path d="M958 465H1422" stroke="#94a3b8" stroke-opacity="0.14"/>
      <text x="958" y="493" fill="#b8c8d8" font-size="16">BMC 已识别 · 管理地址就绪</text>

      <rect x="934" y="548" width="512" height="48" rx="15" fill="#0b5f50"/>
      <text x="958" y="579" fill="#d1fae5" font-size="17" font-weight="750">打开管理页面</text>
      <text x="1388" y="579" fill="#d1fae5" font-size="23" font-weight="700">→</text>
    </g>
  </g>
</svg>
